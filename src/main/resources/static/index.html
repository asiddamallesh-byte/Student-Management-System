
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #20243a;
}

header {
    background: linear-gradient(120deg, #202b50, #4056a5);
    color: white;
    padding: 28px 6%;
}

header h1 {
    font-size: 27px;
}

header p {
    margin-top: 8px;
    color: #d5dcf0;
}

main {
    max-width: 1150px;
    margin: 35px auto;
    padding: 0 20px;
}

.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    flex: 1;
    box-shadow: 0 3px 12px #0000000c;
}

.stat-card p {
    color: #777;
    margin-bottom: 12px;
}

.stat-card h2 {
    font-size: 30px;
    color: #3449a3;
}

#connectionStatus {
    font-size: 22px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px #0000000c;
}

.panel h2 {
    margin-bottom: 20px;
}

form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field label {
    font-size: 13px;
    font-weight: bold;
    color: #555b70;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d9dce7;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #4056c5;
    box-shadow: 0 0 0 3px #4056c51a;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 17px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.primary {
    background: #4056c5;
    color: white;
}

.primary:hover:not(:disabled) {
    background: #3045ad;
}

.cancel {
    background: #e8eaf1;
    color: #333;
}

.search {
    max-width: 350px;
    margin-bottom: 18px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    text-align: left;
    padding: 15px 10px;
    border-bottom: 1px solid #eee;
    overflow-wrap: anywhere;
}

th {
    background: #f7f8fc;
    color: #62677b;
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 8px;
}

.edit {
    background: #e8edff;
    color: #3449a3;
}

.delete {
    background: #ffe9e9;
    color: #c52d2d;
}

#message {
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 14px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px;
}

.form-actions {
    display: flex;
    gap: 10px;
    align-items: end;
}

.status-connected {
    color: #16834a !important;
}

.status-disconnected {
    color: #c52d2d !important;
}

@media(max-width: 700px) {
    header {
        padding: 22px 5%;
    }

    header h1 {
        font-size: 22px;
    }

    main {
        margin: 22px auto;
        padding: 0 12px;
    }

    .stats {
        flex-direction: column;
        gap: 12px;
    }

    form {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 18px;
    }

    .form-actions {
        align-items: center;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage your student records in one place</p>
</header>

<main>

    <section class="stats">
        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card">
            <p>Application Status</p>
            <h2 id="connectionStatus">Checking...</h2>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Add New Student</h2>

        <p id="message" role="status" aria-live="polite"></p>

        <form id="studentForm">

            <div class="field">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name"
                       maxlength="100" required>
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age"
                       placeholder="Enter age"
                       min="1" max="120" required>
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address"
                       maxlength="150" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="primary" id="saveButton">
                    Add Student
                </button>

                <button type="button" class="cancel"
                        id="cancelButton" hidden>
                    Cancel
                </button>
            </div>

        </form>
    </section>

    <section class="panel">
        <h2>Student Records</h2>

        <input type="text" id="search"
               class="search"
               placeholder="Search by name, email or age..."
               aria-label="Search students">

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="5" class="empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
const API_URL = "/students";

let students = [];
let editingId = null;

const form = document.getElementById("studentForm");
const table = document.getElementById("studentTable");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

function showMessage(text, success = true) {
    message.textContent = text;
    message.style.color = success ? "#16834a" : "#c52d2d";
}

function updateConnectionStatus(connected) {
    const status = document.getElementById("connectionStatus");

    status.textContent = connected ? "Connected" : "Disconnected";
    status.className = connected
        ? "status-connected"
        : "status-disconnected";
}

async function getErrorMessage(response) {
    try {
        const data = await response.json();

        if (data.errors) {
            if (Array.isArray(data.errors)) {
                return data.errors.join(", ");
            }

            if (typeof data.errors === "object") {
                return Object.values(data.errors).join(", ");
            }

            return String(data.errors);
        }

        return data.message || data.error ||
            `Request failed (${response.status})`;

    } catch {
        return `Request failed (${response.status})`;
    }
}

async function loadStudents() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Unable to load students");
        }

        students = await response.json();

        updateConnectionStatus(true);

        document.getElementById("totalStudents").textContent =
            students.length;

        displayStudents(students);

    } catch (error) {
        updateConnectionStatus(false);

        table.innerHTML =
            '<tr><td colspan="5" class="empty">Could not connect to backend. Check Spring Boot.</td></tr>';

        showMessage(error.message, false);
    }
}

function displayStudents(list) {
    table.innerHTML = "";

    if (list.length === 0) {
        table.innerHTML =
            '<tr><td colspan="5" class="empty">No students found.</td></tr>';
        return;
    }

    list.forEach(student => {
        const row = document.createElement("tr");

        const values = [
            student.id,
            student.name,
            student.age,
            student.email
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit";
        editButton.addEventListener("click", () => editStudent(student.id));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", () => deleteStudent(student.id));

        actions.append(editButton, deleteButton);
        actionCell.appendChild(actions);
        row.appendChild(actionCell);

        table.appendChild(row);
    });
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const student = {
        name: document.getElementById("name").value.trim(),
        age: Number(document.getElementById("age").value),
        email: document.getElementById("email").value.trim()
    };

    if (!student.name || !student.email ||
        !Number.isInteger(student.age) ||
        student.age < 1 || student.age > 120) {
        showMessage("Please enter valid student details.", false);
        return;
    }

    const isEditing = editingId !== null;

    const url = isEditing
        ? `${API_URL}/${encodeURIComponent(editingId)}`
        : API_URL;

    saveButton.disabled = true;
    saveButton.textContent = isEditing ? "Updating..." : "Adding...";

    try {
        const response = await fetch(url, {
            method: isEditing ? "PUT" : "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        });

        if (!response.ok) {
            throw new Error(await getErrorMessage(response));
        }

        showMessage(isEditing
            ? "Student updated successfully!"
            : "Student added successfully!");

        resetForm();
        await loadStudents();

    } catch (error) {
        showMessage(error.message, false);

    } finally {
        saveButton.disabled = false;
        saveButton.textContent = editingId !== null
            ? "Update Student"
            : "Add Student";
    }
});

function editStudent(id) {
    const student = students.find(s => s.id === id);

    if (!student) return;

    editingId = id;

    document.getElementById("name").value = student.name;
    document.getElementById("age").value = student.age;
    document.getElementById("email").value = student.email;

    document.getElementById("formTitle").textContent = "Edit Student";
    saveButton.textContent = "Update Student";
    document.getElementById("cancelButton").hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/${encodeURIComponent(id)}`,
            { method: "DELETE" }
        );

        if (!response.ok) {
            throw new Error(await getErrorMessage(response));
        }

        showMessage("Student deleted successfully!");

        if (editingId === id) resetForm();

        await loadStudents();

    } catch (error) {
        showMessage(error.message, false);
    }
}

function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById("formTitle").textContent =
        "Add New Student";

    saveButton.textContent = "Add Student";
    document.getElementById("cancelButton").hidden = true;
}

document.getElementById("cancelButton").addEventListener(
    "click", resetForm
);

document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase().trim();

    const filtered = students.filter(student =>
        String(student.name).toLowerCase().includes(query) ||
        String(student.email).toLowerCase().includes(query) ||
        String(student.age).includes(query)
    );

    displayStudents(filtered);
});

loadStudents();
</script>

</body>
</html>
